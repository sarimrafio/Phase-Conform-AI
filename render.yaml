services:
  # =====================================================================
  # FastAPI Chemical Engine (RDKit, MMFF94 forcefield, 2D SVGs)
  # =====================================================================
  - type: web
    name: phase-conform-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9


